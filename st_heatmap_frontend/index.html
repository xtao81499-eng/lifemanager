<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
body { background: transparent; overflow: visible; }
.hm-container {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 1.2rem 1rem;
    box-shadow: 0 2px 20px rgba(60,60,67,0.06), 0 0 1px rgba(60,60,67,0.12);
    overflow-x: auto;
}
.hm-grid {
    display: inline-grid;
    column-gap: 3px;
    row-gap: 4px;
    align-items: center;
}
.hm-date-label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 600; color: #1D1D1F; line-height: 1.2;
}
.hm-date-label span { font-weight: 400; color: #86868B; }
.hm-label { font-size: 0.78rem; font-weight: 500; color: #1D1D1F; text-align: right; padding-right: 0.8rem; white-space: nowrap; }
.hm-cell {
    border-radius: 5px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: default; position: relative; justify-self: center;
}
.hm-cell:hover { transform: scale(1.2); box-shadow: 0 4px 12px rgba(60,60,67,0.14); z-index: 10; }
.hm-active { background: #34C759; }
.hm-empty { background: #E5E5EA; }
.hm-today-manual { cursor: pointer; box-shadow: 0 0 0 2px #0A84FF; }
.hm-today-manual:active { transform: scale(0.85); }
.hm-streak { font-size: 0.65rem; color: #86868B; font-weight: 500; padding-left: 0.5rem; white-space: nowrap; }
.hm-spacer { pointer-events: none; }
#hm-popup {
    display: none; position: fixed; background: #1D1D1F; color: #FFFFFF;
    border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.72rem;
    z-index: 9999; pointer-events: none; min-width: 100px; max-width: 200px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
#hm-popup .pop-date { font-weight: 600; margin-bottom: 0.2rem; }
#hm-popup .pop-score { color: #34C759; font-weight: 600; margin-bottom: 0.3rem; }
#hm-popup .pop-detail { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 0.35rem; margin-top: 0.2rem; }
#hm-popup .pop-detail-line { color: #E5E5EA; line-height: 1.5; font-size: 0.68rem; }
#hm-popup .pop-empty { color: #86868B; font-style: italic; }
</style>
</head>
<body>
<div class="hm-container">
    <div class="hm-grid" id="grid"></div>
</div>
<div id="hm-popup"></div>
<script>
// Minimal Streamlit Component Lib (inline, no external file needed)
var Streamlit = (function() {
    var lastArgs = null;
    var renderCallbacks = [];

    function sendMessage(type, data) {
        window.parent.postMessage(Object.assign({type: type, isStreamlitMessage: true}, data), "*");
    }

    window.addEventListener("message", function(e) {
        if (!e.data || !e.data.type) return;
        if (e.data.type === "streamlit:render") {
            lastArgs = e.data.args;
            renderCallbacks.forEach(function(cb) {
                cb({detail: {args: e.data.args}});
            });
        }
    });

    return {
        setComponentReady: function() { sendMessage("streamlit:componentReady", {apiVersion: 1}); },
        setComponentValue: function(value) { sendMessage("streamlit:setComponentValue", {value: value}); },
        setFrameHeight: function(h) { sendMessage("streamlit:setFrameHeight", {height: h || document.body.scrollHeight}); },
        RENDER_EVENT: "render",
        events: {
            addEventListener: function(type, cb) { renderCallbacks.push(cb); if (lastArgs) cb({detail: {args: lastArgs}}); }
        }
    };
})();
</script>
<script>
let clickTimer = null;

function onRender(event) {
    const data = event.detail.args.grid_data;
    const todayIso = event.detail.args.today_iso;
    const cols = data.dates.length;
    const container = document.querySelector('.hm-container');
    const availWidth = container.clientWidth - 32 - 80 - 36;
    const cellSize = Math.max(14, Math.min(24, Math.floor((availWidth - (cols - 1) * 3) / cols)));
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = "5rem repeat(" + cols + ", " + cellSize + "px) auto";

    // Header row
    grid.appendChild(el("div", "hm-spacer", ""));
    data.dates.forEach(function(d) {
        const h = el("div", "hm-date-label", "");
        h.innerHTML = d.day + '<span>' + d.weekday + '</span>';
        h.style.fontSize = Math.max(9, Math.min(12, Math.floor(cellSize / 2))) + "px";
        grid.appendChild(h);
    });
    grid.appendChild(el("div", "hm-spacer", ""));

    // Data rows
    data.rows.forEach(function(row) {
        grid.appendChild(el("div", "hm-label", row.label));
        row.cells.forEach(function(c, i) {
            const cell = document.createElement("div");
            const iso = data.dates[i].iso;
            const isToday = iso === todayIso;
            let cls = "hm-cell " + (c.active ? "hm-active" : "hm-empty");
            if (row.manual && isToday) cls += " hm-today-manual";
            cell.className = cls;
            cell.style.width = cellSize + "px";
            cell.style.height = cellSize + "px";
            if (row.manual) {
                cell.dataset.habit = row.label;
                cell.dataset.iso = iso;
            }
            if (c.score) cell.dataset.score = c.score;
            if (c.detail) cell.dataset.detail = c.detail;
            cell.dataset.date = c.date_display || "";
            cell.addEventListener("mouseenter", showPopup);
            cell.addEventListener("mouseleave", hidePopup);
            if (row.manual && isToday) {
                cell.addEventListener("click", function() { onTodayClick(cell); });
            }
            grid.appendChild(cell);
        });
        grid.appendChild(el("div", "hm-streak", row.streak));
    });

    Streamlit.setFrameHeight(document.querySelector('.hm-container').offsetHeight + 10);
}

function el(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    e.textContent = text;
    return e;
}

function onTodayClick(cell) {
    const habit = cell.dataset.habit;
    const iso = cell.dataset.iso;
    const isActive = cell.classList.contains("hm-active");

    if (!isActive) {
        cell.classList.remove("hm-empty");
        cell.classList.add("hm-active");
        Streamlit.setComponentValue(habit + "|" + iso + "|check|" + Date.now());
    } else {
        if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
            cell.classList.remove("hm-active");
            cell.classList.add("hm-empty");
            Streamlit.setComponentValue(habit + "|" + iso + "|uncheck|" + Date.now());
        } else {
            clickTimer = setTimeout(function() { clickTimer = null; }, 400);
        }
    }
}

function showPopup(e) {
    const cell = e.currentTarget;
    const popup = document.getElementById("hm-popup");
    const dateStr = cell.dataset.date || "";
    if (!dateStr) return;
    let html = '<div class="pop-date">' + dateStr + '</div>';
    const score = cell.dataset.score || "";
    if (score) {
        html += '<div class="pop-score">' + score + '/10</div>';
    } else if (cell.classList.contains("hm-active")) {
        html += '<div class="pop-score">已完成</div>';
    } else {
        html += '<div class="pop-empty">未记录</div>';
    }
    const detail = cell.dataset.detail || "";
    if (detail) {
        const lines = detail.split("\n").filter(function(l) { return l.trim(); });
        html += '<div class="pop-detail">' + lines.map(function(l) { return '<div class="pop-detail-line">' + l + '</div>'; }).join('') + '</div>';
    }
    popup.innerHTML = html;
    popup.style.display = "block";
    const rect = cell.getBoundingClientRect();
    popup.style.left = (rect.left + rect.width/2 - popup.offsetWidth/2) + "px";
    popup.style.top = (rect.top - popup.offsetHeight - 8) + "px";
}

function hidePopup() {
    document.getElementById("hm-popup").style.display = "none";
}

Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
Streamlit.setComponentReady();
</script>
</body>
</html>
